version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sdl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: system_design_learner
    ports:
      - "5432:5432"
    volumes:
      - sdl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sdl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sdl_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sdl_postgres_data:
  sdl_redis_data:
